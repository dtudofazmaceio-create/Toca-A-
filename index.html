<style>

*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 0 0}

h1,h2,h3{font-weight:800;letter-spacing:-.01em}
.btn{background:var(--a);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;color:var(--ap)}
.btn.g{background:var(--p2);border:1px solid var(--l)}
.sm{background:var(--p2);border:1px solid var(--l);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.sm.ok{background:var(--ok);color:#06281a;border:0;font-weight:700}.sm.no{color:var(--no)}
input,select{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:10px;padding:11px 12px;margin:4px 0 12px}
input:focus,button:focus-visible{outline:2px solid var(--b);outline-offset:1px}
label{font-size:13px;color:var(--m)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
nav{background:var(--p);padding:20px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--l)}
.brand{display:flex;gap:8px;align-items:center;margin-bottom:18px;font-size:17px}
#dot{width:10px;height:10px;border-radius:50%;background:var(--m);margin-left:auto}#dot.on{background:var(--ok)}#dot.off{background:var(--no)}
nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--m)}
nav a.on{background:var(--p2);color:var(--t)}
nav em{margin-left:auto;background:var(--a);color:var(--ap);border-radius:99px;padding:0 8px;font-style:normal;font-size:12px}nav em:empty{display:none}
main{padding:24px;overflow:auto}
.tabs{display:none}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.cols section>h3{margin-bottom:12px;display:flex;gap:8px;align-items:center}
.cols h3 b{background:var(--p2);border-radius:99px;padding:0 9px;font-size:13px;font-family:system-ui}
.cols h3 .sm{margin-left:auto}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
.card.fresh{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.card h4{font-size:17px}.card p{color:var(--m);font-size:13px;margin-top:2px}
.card .act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--b);color:var(--ab);border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;margin-left:6px}
.empty{color:var(--m);padding:18px;text-align:center;border:1px dashed var(--l);border-radius:14px}
.panel{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:20px;margin-bottom:18px;max-width:720px}
.qrs{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.qb{background:#fff;padding:10px;border-radius:12px;display:inline-block}.qb img,.qb canvas{display:block}
.note{background:var(--p2);border-left:4px solid var(--b);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
#print{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:9}
/* convidado */
.gw{max-width:480px;margin:0 auto;padding:22px 18px 40px}
.hero{text-align:center;padding:10px 0 20px}.hero h1{font-size:30px}.hero p{color:var(--m)}
.hero .ev{color:var(--b);font-weight:700;margin-bottom:6px}
.gs{display:flex;gap:12px;align-items:center}.gs .qb{padding:6px}
.st{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--p2);white-space:nowrap}.st.queue{background:var(--b);color:var(--ab)}.st.played{background:var(--ok);color:#06281a}.st.rejected{color:var(--no)}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--l)}
.btn.w{width:100%;padding:14px;font-size:16px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.chip{display:inline-flex}.chip img{height:24px;max-width:90px;object-fit:contain}
.ic{flex:none;vertical-align:middle}
.btn,a.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center}
.sm{display:inline-flex;gap:5px;align-items:center}
.btn:active,.sm:active,.ib:active{transform:scale(.97)}
.panel h2,.panel h3{display:flex;gap:8px;align-items:center}
.card{border-radius:16px;box-shadow:0 10px 24px -14px rgba(0,0,0,.55)}
.card .ct{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .ar{font-size:14px;color:var(--t);opacity:.8;margin:2px 0 8px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--m)}.meta span{display:inline-flex;gap:4px;align-items:center}
.tag.nx{background:var(--a);color:var(--ap)}
.card.s-new{border-left:4px solid var(--a)}.card.s-queue{border-left:4px solid var(--b)}.card.s-played{border-left:4px solid var(--ok)}.card.s-rejected{border-left:4px solid var(--no)}
.top{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.srch{position:relative;flex:1;min-width:200px}.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--m)}.srch input{margin:0;padding-left:38px}
.ib{background:var(--p);border:1px solid var(--l);border-radius:10px;height:44px;padding:0 14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-weight:700}
.ib.on{background:var(--a);color:var(--ap);border-color:var(--a)}.ib.off{color:var(--no);border-color:var(--no)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.stat b{font-size:22px;line-height:1}.stat small{display:block;color:var(--m);font-size:12px;margin-top:2px}.stat .ic{color:var(--a)}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 var(--ok)}70%,100%{box-shadow:0 0 0 7px transparent}}
.badge{display:inline-flex;gap:8px;align-items:center;background:var(--p);border:1px solid var(--l);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700}
.fld div{position:relative}.fld svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--m);pointer-events:none;margin-top:-4px}.fld input{padding-left:38px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--p2);border-radius:99px;padding:6px 14px;margin-bottom:14px;font-weight:700}
.st{display:inline-flex;gap:4px;align-items:center}
.sk{background:linear-gradient(90deg,var(--p) 25%,var(--p2) 50%,var(--p) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}@keyframes sh{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}.hero{animation:rise .5s both}
#toast{gap:8px;align-items:center}
.empty .ic{opacity:.6;margin-bottom:6px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--a)}
#bgl{position:fixed;inset:0;z-index:-1}
.lg{display:block;margin:0 auto 12px;max-height:84px;max-width:70%;object-fit:contain}
.ths{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 16px}
.th{border:2px solid;border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:6px;align-items:center;font-family:inherit}.th.on{box-shadow:0 0 0 3px var(--t)}
.sw{width:16px;height:16px;border-radius:50%;display:inline-block}
.up{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.up input{flex:1;min-width:180px;margin:4px 0 12px}.up .chip img{height:44px;max-width:140px}.bgp{height:44px;border-radius:8px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr;padding-bottom:70px}
 nav{position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--l);z-index:5}
 nav .brand{display:none}nav a{flex-direction:column;gap:2px;font-size:12px;padding:6px 18px;position:relative}
 nav em{position:absolute;top:0;right:8px;margin:0}
 main{padding:16px}
 .tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--p);border:1px solid var(--l);border-radius:10px;padding:9px 4px;cursor:pointer}
 .tabs button.on{background:var(--a);border-color:var(--a);color:var(--ap)}
 .cols{display:block}.cols section{display:none}.cols section.on{display:block}
}
@media print{body>*{display:none!important}#print{display:grid!important;grid-template-columns:1fr 1fr;gap:12px;background:#fff;color:#000}
 #print div{border:2px solid #000;border-radius:14px;padding:16px;text-align:center;page-break-inside:avoid}#print h2{font-size:26px}#print .qb{padding:0}}

function qrImg(text,lvl='M'){const d=document.createElement('div');new QRCode(d,{text,width:600,height:600,correctLevel:QRCode.CorrectLevel[lvl]});return d.querySelector('canvas').toDataURL('image/png')}
function cutWhite(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
 const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){const m=Math.min(a[i],a[i+1],a[i+2]);if(m>228)a[i+3]=0;else if(m>200)a[i+3]=Math.round(a[i+3]*(228-m)/28)}
 x.putImageData(d,0,0);ok(c.toDataURL('image/png'))};im.onerror=()=>ok(src);im.src=src})}
function cardBg(src,o){return new Promise(ok=>{const im=new Image();im.onload=()=>{const w=856,h=540,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.beginPath();if(x.roundRect)x.roundRect(0,0,w,h,30);else x.rect(0,0,w,h);x.clip();
 const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;x.globalAlpha=o;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);ok(c.toDataURL('image/png'))};im.onerror=()=>ok('');im.src=src})}
function pdfCards(){
 if(!G.id||!G.tok)return toast('Configure o Gist em Ajustes primeiro');
 if(!window.jspdf)return toast('Biblioteca de PDF não carregou. Verifique a internet.');
 const n=Math.min(200,Math.max(1,+$('#nt').value||10));const ph=$('#fr').value.trim(),tg=$('#nm').value=='1';S.cfg.tables=n;S.cfg.phrase=ph;S.cfg.tagm=tg;kv.set('cfg',S.cfg);toast('Gerando PDF…');
 setTimeout(async()=>{
 const T=TH[S.cfg.theme]||TH.neon,pk=S.cfg.pc||T.a;
 const bgd=S.cfg.bg?await cardBg(S.cfg.bg,(S.cfg.bgo==null?30:+S.cfg.bgo)/100):'';
 const doc=new jspdf.jsPDF({unit:'mm',format:'a4'}),W=85.6,H=54,gx=6,gy=6,ox=(210-2*W-gx)/2,oy=(297-4*H-3*gy)/2;
 const BG=h2r(T.bg),LN=h2r(T.l),TX=h2r(T.t),MU=h2r(T.m),PK=h2r(pk),AM=h2r(T.b),PT=h2r(on(pk)),WH=[255,255,255];
 const fill=c=>doc.setFillColor(...c),ink=c=>doc.setTextColor(...c);
 const smalls=[];
 if(S.cfg.ig)smalls.push(['Instagram',qrImg(url(S.cfg.ig)),'qig']);
 if(S.cfg.gr)smalls.push(['Avalie no Google',qrImg(S.cfg.gr),'qgr']);
 const nome=doc.splitTextToSize(S.cfg.name||'DJ',37)[0];
 let lg=null;if(S.cfg.logo){const p=doc.getImageProperties(S.cfg.logo),k=Math.min(32/p.width,10.5/p.height);lg={w:p.width*k,h:p.height*k}}
 const qa=tg?null:qrImg(link(),'L');
 const ax=lg?4.5+lg.w+4:4.5,pw=W-4.5-ax,pc=ax+pw/2;
 let fs=13,pl=null;doc.setFont('helvetica','bold');
 if(ph){for(;fs>=8;fs-=.5){doc.setFontSize(fs);if(doc.getTextWidth(ph)<=pw){pl=[ph];break}}
  if(!pl)for(fs=11;fs>=6;fs-=.5){doc.setFontSize(fs);pl=doc.splitTextToSize(ph,pw);if(pl.length<=2)break}}
 for(let i=1;i<=n;i++){
  const k=(i-1)%8;if(i>1&&k==0)doc.addPage();
  const x=ox+(k%2)*(W+gx),y=oy+Math.floor(k/2)*(H+gy);
  fill(BG);doc.roundedRect(x,y,W,H,3,3,'F');if(bgd)doc.addImage(bgd,'PNG',x,y,W,H,'bgc');doc.setDrawColor(...LN);doc.setLineWidth(.25);doc.roundedRect(x,y,W,H,3,3,'S');
  if(lg){doc.addImage(S.cfg.logo,'PNG',x+4.5,y+3+(10.5-lg.h)/2,lg.w,lg.h,'logo')}
  else{ink(AM);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text(nome,x+62.5,y+46,{align:'center'})}
  fill(WH);doc.roundedRect(x+4.5,y+15.5,34,34,2.5,2.5,'F');
  doc.addImage(tg?qrImg(link(i),'L'):qa,'PNG',x+6.5,y+17.5,30,30,tg?undefined:'qmain');
  smalls.forEach((q,j)=>{const bx=x+44+j*19.5;
   fill(WH);doc.roundedRect(bx,y+15.5,17,17,2,2,'F');doc.addImage(q[1],'PNG',bx+1.5,y+17,14,14,q[2]);
   ink(TX);doc.setFont('helvetica','normal');doc.setFontSize(5.5);doc.text(q[0],bx+8.5,y+35.5,{align:'center'})});
  if(pl){const n2=Math.min(2,pl.length);ink(TX);doc.setFont('helvetica','bold');doc.setFontSize(fs);
   doc.text(pl.slice(0,2),x+pc,y+8.5-(n2-1)*fs*.423/2+fs*.12,{align:'center',lineHeightFactor:1.2});
   fill(PK);doc.rect(x+pc-6,y+13.4,12,0.6,'F')}
 }
 doc.save('cartoes-mesas.pdf');toast('PDF pronto');
 },60)}

 try{
  const dirty=S.reqs.filter(r=>r.dirty);
  if(dirty.length){const files={};dirty.forEach(r=>{const{dirty:_,del,...o}=r;files[r.id+'.json']=del?null:{content:JSON.stringify(o)}});
   await gh('PATCH','/gists/'+G.id,{files});G.et='';
   for(const r of dirty){if(r.del){await R.del(r.id)}else{r.dirty=0;await R.put(r)}}S.reqs=S.reqs.filter(r=>!(r.del&&dirty.includes(r)))}
  const res=await gh('GET','/gists/'+G.id,null,G.et);
  if(!res.nm){G.et=res.et;const rem={};let nw=[];
   for(const[n,f]of Object.entries(res.j.files)){if(!/^r_.*\.json$/.test(n))continue;try{const o=JSON.parse(f.content);rem[o.id]=o}catch{}}
   for(const o of Object.values(rem)){const l=S.reqs.find(x=>x.id==o.id);
    if(!l){S.reqs.push(o);R.put(o);nw.push(o)}else if(!l.dirty&&l.status!=o.status){l.status=o.status;R.put(l)}}
   for(const l of S.reqs.slice())if(!rem[l.id]&&!l.dirty){S.reqs.splice(S.reqs.indexOf(l),1);R.del(l.id)}
   const news=nw.filter(o=>o.status=='new');
   if(news.length){news.forEach(o=>S.fresh.add(o.id));alertNew(news)}
   viewReq()}
  dot.className='on'}catch(e){dot.className='off'}busy=0}
function beep(){if(S.cfg.mute)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.start();o.stop(c.currentTime+.7)}catch{}}
function alertNew(a){beep();navigator.vibrate&&navigator.vibrate([200,100,200]);
 if('Notification'in window&&Notification.permission=='granted'){try{new Notification((a.length>1?a.length+' novos pedidos':'Novo pedido'),{body:a[0].song+(a[0].artist?' — '+a[0].artist:'')})}catch{}}}

/* ================= CONVIDADO ================= */
async function guestApp(P){
 const o=b64d(P.get('g'));G.tok=o.t;G.id=o.i;const mesa=P.get('m')||'';
 let cfg=clean((await kv.get('gcfg'))||{}),mine=(await kv.get('mine'))||[],last='',lt=(await kv.get('last'))||0,ready=!!cfg.name,sending=0;
 const SI={new:'clock',queue:'headphones',played:'okc',rejected:'x'};
 const F=(id,lb,i,ml)=>`<label class="fld"><span>${lb}</span><div>${ic(i,17)}<input id="${id}" maxlength="${ml}" autocomplete="off"></div></label>`;
 function draw(){const sig=JSON.stringify([cfg,mine,ready]);if(sig==last)return;last=sig;applyTheme(cfg);
  const open=cfg.open!==false,vals=$$('input').map(i=>i.value);
  $('#app').innerHTML=`<div class="gw"><div class="hero">${cfg.logo?`<img class="lg" src="${cfg.logo}" alt="">`:''}${cfg.ev?`<div class="ev">${esc(cfg.ev)}</div>`:''}
  ${ready?`<h1>${esc(cfg.name||'DJ')}</h1><p>${esc(cfg.tag||'Escolha a próxima música da pista.')}</p>`:'<div class="sk" style="width:60%;height:34px;margin:8px auto"></div><div class="sk" style="width:80%;height:16px;margin:12px auto"></div>'}
  <div style="margin-top:14px"><span class="badge">${open?'<i class="live"></i>Pedidos abertos':ic('lock',14)+'Pedidos fechados'}</span></div></div>
  <div class="panel" style="max-width:none">${open?`<h3>${ic('music',20)} Qual música você quer ouvir?</h3><br>${F('s','Música *','music',80)}${F('a','Artista','mic',60)}${F('n','Seu nome','user',30)}${mesa?`<span class="pill">${ic('pin',15)}Mesa ${esc(mesa)}</span>`:F('m','Mesa (opcional)','pin',6)}<button class="btn w" id="send">${ic('send',18)}Enviar pedido</button>`:`<h3>${ic('lock',20)} Pedidos fechados</h3><p style="color:var(--m);margin-top:6px">Volte em breve. O DJ abre os pedidos durante o evento.</p>`}</div>
  ${mine.length?`<div class="panel" style="max-width:none"><h3>${ic('list',20)} Seus pedidos</h3>${mine.map(m=>`<div class="li"><span><b>${esc(m.song)}</b><br><small style="color:var(--m)">${esc(m.artist)}</small></span><span class="st ${esc(m.status)}">${ic(SI[m.status]||'clock',14)}${esc(LB[m.status]||'')}</span></div>`).join('')}</div>`:''}
  ${cfg.ig?`<div class="panel gs" style="max-width:none"><div class="qb" id="qi"></div><div><h3>${ic('ig',18)} Me siga</h3><p style="color:var(--m)">Fotos e agenda de eventos</p><br><a class="btn" href="${esc(cfg.ig)}" target="_blank" rel="noopener">${ic('ig',16)}Abrir Instagram</a></div></div>`:''}
  ${cfg.gr?`<div class="panel gs" style="max-width:none"><div class="qb" id="qg"></div><div><h3>${ic('star',18)} Gostou da festa?</h3><p style="color:var(--m)">Sua avaliação ajuda muito</p><br><a class="btn" href="${esc(cfg.gr)}" target="_blank" rel="noopener">${ic('star',16)}Avaliar no Google</a></div></div>`:''}</div>`;
  $$('input').forEach((i,k)=>{if(vals[k])i.value=vals[k]});
  if(cfg.ig)qr($('#qi'),cfg.ig,96);if(cfg.gr)qr($('#qg'),cfg.gr,96);
  const b=$('#send');if(b)b.onclick=send}
 async function send(){const song=$('#s').value.trim();if(!song)return toast('Digite o nome da música');
  if(Date.now()-lt<30000)return toast('Aguarde alguns segundos para pedir outra');
  const id='r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const r={id,song:song.slice(0,80),artist:$('#a').value.trim().slice(0,60),name:$('#n').value.trim().slice(0,30),table:mesa||($('#m')?$('#m').value.trim():''),ts:Date.now(),status:'new'};
  sending=1;$('#send').disabled=true;
  try{await gh('PATCH','/gists/'+G.id,{files:{[id+'.json']:{content:JSON.stringify(r)}}});
   mine.unshift({id,song:r.song,artist:r.artist,status:'new'});lt=Date.now();await kv.set('mine',mine);await kv.set('last',lt);
   navigator.vibrate&&navigator.vibrate(40);$$('input').forEach(i=>i.value='');last='';sending=0;draw();toast('Pedido enviado!')}
  catch{sending=0;toast('Não foi possível enviar. Tente de novo.');$('#send').disabled=false}}
 async function load(){try{const r=await gh('GET','/gists/'+G.id,null,G.et);if(r.nm)return;G.et=r.et;const f=r.j.files;
   if(f['config.json'])cfg=clean(JSON.parse(f['config.json'].content));ready=true;
   mine.forEach(m=>{const x=f[m.id+'.json'];if(x)try{m.status=JSON.parse(x.content).status}catch{}});
   kv.set('gcfg',cfg);kv.set('mine',mine);draw()}catch{}}
 draw();load();setTimeout(()=>{ready=true;draw()},4000);
 setInterval(()=>{const b=$('#send');if(!b||sending)return;const w=Math.ceil((30000-(Date.now()-lt))/1000);
  if(w>0){b.disabled=true;b.lastChild.textContent='Aguarde '+w+'s'}else if(b.disabled){b.disabled=false;b.lastChild.textContent='Enviar pedido'}},500);
 setInterval(()=>{if(!document.hidden&&mine.some(m=>m.status=='new'||m.status=='queue'))load()},30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
}

let ipr;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ipr=e});
if('serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

(async()=>{const P=new URLSearchParams(location.hash.slice(1));
 if(P.get('g')){try{return await guestApp(P)}catch{return $('#app').innerHTML='<div class="gw"><p class="empty">Link inválido. Peça um novo QR Code ao DJ.</p></div>'}}
 S.cfg=(await kv.get('cfg'))||{};G.tok=S.cfg.tok||'';G.id=S.cfg.gid||'';S.reqs=await R.all();djApp()})();
</script></body></html>
